name: go-ci

on:
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .goreleaser.yaml
      - .github/workflows/go-*.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
