version: 2

project_name: hs

builds:
  - id: hs
    main: ./cmd/hs
    binary: hs
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - formats:
      - tar.gz
    # mise の github: バックエンドが OS と CPU を名前から選べるよう、版を入れずに並べる。
    name_template: "hs_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
